# ==============================================================================
# NGINX REVERSE PROXY & STATIC HOSTING CONFIGURATION — JBS TRANSPORT ERP
# Domains:
#   Frontend SPA: https://erp.jbstranspune.com
#   Backend API:  https://api.jbstranspune.com
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. FRONTEND: erp.jbstranspune.com (React 18 SPA)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name erp.jbstranspune.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.jbstranspune.com;

    # SSL Certificate Configuration (Let's Encrypt / Certbot paths)
    ssl_certificate /etc/letsencrypt/live/erp.jbstranspune.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.jbstranspune.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/erp.jbstranspune.com/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Cache static assets (Vite hashed bundles in /assets/)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA Routing: Any deep URL must fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/erp_access.log;
    error_log /var/log/nginx/erp_error.log;
}

# ------------------------------------------------------------------------------
# 2. BACKEND API: api.jbstranspune.com (Node.js Express REST API)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.jbstranspune.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.jbstranspune.com;

    # SSL Certificate Configuration
    ssl_certificate /etc/letsencrypt/live/api.jbstranspune.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.jbstranspune.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Allow up to 50MB for file uploads (Excel reports, Word docs, LR attachments)
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:4800;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for heavy operations (PDF rendering, large Excel exports)
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # Disable buffering for streaming responses
        proxy_buffering off;
    }

    # Static assets served directly from backend/public
    location /public/ {
        proxy_pass http://127.0.0.1:4800/public/;
        expires 7d;
        add_header Cache-Control "public";
    }

    access_log /var/log/nginx/api_access.log;
    error_log /var/log/nginx/api_error.log;
}
